# Configuration for adapting Moonshine's base English model to a new English dataset
# with different accents. This expects a local DatasetDict saved with save_to_disk().
#
# Recommended dataset structure:
# - train/test splits
# - audio column cast as datasets.Audio(sampling_rate=16000)
# - transcript column such as text, transcription, transcript, or sentence

model:
  name: "UsefulSensors/moonshine-tiny"
  freeze_encoder: false

dataset:
  type: "local"
  path: "./data/english_accents_split"
  text_column: "text"

audio:
  sampling_rate: 16000
  max_duration: 20.0
  min_duration: 1.0

preprocessing:
  num_proc: 4
  normalize_audio: true
  target_rms: 0.075

curriculum:
  enabled: false

training:
  output_dir: "./results-moonshine-en-accents"

  per_device_train_batch_size: 4
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 16
  gradient_checkpointing: true
  fp16: true
  fp16_full_eval: true
  group_by_length: true
  length_column_name: "input_length"
  max_grad_norm: 1.0

  max_steps: 6000

  optim: "schedule_free_adamw"
  learning_rate: 1.0e-4
  lr_scheduler_type: "constant_with_warmup"
  warmup_steps: 300

  eval_strategy: "steps"
  eval_steps: 500
  save_steps: 500
  logging_steps: 50
  predict_with_generate: true

  load_best_model_at_end: true
  metric_for_best_model: "wer"
  greater_is_better: false

  report_to: ["tensorboard"]
  logging_dir: "./logs/moonshine-en-accents"

  push_to_hub: false
  hub_model_id: null
  hub_strategy: "every_save"
  hub_token: null

generation:
  max_new_tokens: 50
  length_penalty: 1.2
  do_sample: false
  early_stopping: true
  repetition_penalty: 1.2
  num_beams: 5
  no_repeat_ngram_size: 2
